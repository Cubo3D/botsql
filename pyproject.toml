[project]
name = "botsql"
version = "0.1.0"
description = "O BotSQL é um bot do Telegram"
readme = "README.md"
authors = [
    { name = "Wesley Xavier", email = "wesley.xvier@gmail.com" },
    { name = "Cubo3D", email = "davisilvaperes@proton.me" },
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "sqlalchemy>=2.0.52",
    "telebot>=0.0.5",
]
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest]
pythonpath = ['src']

